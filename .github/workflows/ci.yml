name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # A Postgres service container, isolated to this job run and torn down
    # afterward. Needed because the integration test suite (tests/integration/)
    # deliberately hits a real database rather than mocking Prisma — see
    # README.md's "Local checks vs. CI" section for why. The credentials
    # below are throwaway, container-local, and never used outside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test_ci_password
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://finance_test:finance_test_ci_password@localhost:5432/finance_test?schema=public"
      DEV_USER_ID: "dev-user"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
