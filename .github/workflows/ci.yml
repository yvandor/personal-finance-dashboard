name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # A Postgres service container, isolated to this job run and torn down
    # afterward. Needed because the integration test suite (tests/integration/)
    # deliberately hits a real database rather than mocking Prisma — see
    # README.md's "Local checks vs. CI" section for why. The credentials
    # below are throwaway, container-local, and never used outside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test_ci_password
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://finance_test:finance_test_ci_password@localhost:5432/finance_test?schema=public"
      DEV_USER_ID: "dev-user"
      # `next build` forces NODE_ENV=production internally regardless of the
      # runner's own shell env, which trips server/env.ts's pre-auth
      # production guard (v1.4) -- CI building successfully is a deliberate,
      # controlled acknowledgment that this is still a pre-auth build, not a
      # real deploy. See docs/PROJECT_PLAN.md §8 and server/env.ts's comment.
      PREAUTH_MODE_ACKNOWLEDGED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on any high-or-critical severity advisory in the
      # dependency tree. Runs early, before the slower steps below, so a
      # known-vulnerable dependency fails fast rather than after a full
      # build/test cycle.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      # Next.js generates ambient types (e.g. LayoutProps) into .next/types/
      # the first time it builds or runs -- normally invisible locally
      # because a dev/build cycle has usually already happened at least
      # once. On a from-scratch CI checkout, `tsc --noEmit` alone would fail
      # with "Cannot find name 'LayoutProps'" without generating them first.
      # `next typegen` does only that, without a full build.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm run test

      # A separate step from the tests above (not folded into `npm run
      # test`) so a coverage-threshold failure is reported distinctly from
      # a plain test failure, and instrumentation doesn't slow the normal
      # fast path.
      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # A separate job (not steps appended to `ci` above) so it runs in
  # parallel rather than lengthening that job's critical path, and so a
  # Playwright failure is reported distinctly from a unit/build failure.
  # Its own Postgres service container, entirely separate from the `ci`
  # job's -- a genuinely dedicated E2E database, never finance_dev, with
  # its own throwaway, container-local credentials meaningless outside
  # this job (same pattern as the `ci` job's own service credentials).
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance_e2e
          POSTGRES_PASSWORD: finance_e2e_ci_password
          POSTGRES_DB: finance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finance_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://finance_e2e:finance_e2e_ci_password@localhost:5432/finance_e2e?schema=public"
      DEV_USER_ID: "e2e-dev-user"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Chromium only, not the full browser matrix -- this is a smoke
      # suite for critical journeys, not a cross-browser compatibility
      # gate; keeping it to one browser is what keeps it fast.
      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      # Migrations are applied by e2e/global-setup.ts itself (via
      # `prisma migrate deploy`), so `npx playwright test` is the single,
      # complete, self-sufficient command -- identical locally and in CI.
      - name: Run Playwright E2E suite
        run: npx playwright test
        env:
          CI: true

      # Runs after the step above, never alongside it -- see
      # playwright.config.ts's comment on why the dev-server suite and this
      # production-build suite must not run concurrently (both would fight
      # over .next). GitHub Actions steps are sequential by default, so this
      # is safe as a separate step in the same job rather than a separate
      # job. This is the ONLY CI coverage for the offline-fallback test --
      # the single most important test in the whole v1.4 PWA slice.
      - name: Run PWA production-build E2E suite (service worker + offline fallback)
        run: npm run test:e2e:pwa
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
